name: build

on:
  push:
  pull_request:

jobs:
  m68k-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Amiga (vbcc + vasm + vlink)
        run: docker build -t amiga-decomp-toolchain -f docker/Dockerfile .

      - name: Python deps (host, per diff tool)
        run: pip install -r tools/requirements.txt

      - name: Self-test tool di matching
        run: |
          python3 tools/diff_m68k.py --self-test
          python3 tools/split_hunk.py --self-test

      - name: Build oggetti ricompilati
        run: docker run --rm -v ${{ github.workspace }}:/workspace amiga-decomp-toolchain make build

      - name: Report matching (formato decomp.dev v2)
        run: docker run --rm -v ${{ github.workspace }}:/workspace amiga-decomp-toolchain make report

      - name: Upload report per decomp.dev
        uses: actions/upload-artifact@v4
        with:
          name: m68k-report
          path: build/report.json
